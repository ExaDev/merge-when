name: Merge when
description: Merge pull requests once conditions you list hold, such as a label, a passing check or approvals.
author: ExaDev
branding:
  icon: git-merge
  color: green

inputs:
  when:
    description: The conditions that must all hold, one per line. label, check, threads-resolved, not-draft, approvals, author and base are known; see the README.
    required: true
  merge-method:
    description: rebase, squash, merge (through the API, which needs a token) or fast-forward (a push of the pull request's head commit to its base branch, with a token or a deploy key; only a pull request already up to date with its base is merged).
    default: rebase
  merge-token:
    description: An API token that performs the merge, a personal access token or a GitHub App installation token. Use one rather than GITHUB_TOKEN when the merge must start further workflows, which GitHub does not do for pushes made with GITHUB_TOKEN.
  app-id:
    description: A GitHub App's id, as an alternative to merge-token. The action mints an installation token for this repository with it, so the app needs read and write on contents and pull requests.
  app-private-key:
    description: The private key of the GitHub App named by app-id.
  ssh-key:
    description: Private half of a write deploy key, for merge-method fast-forward. A deploy key is an SSH key and cannot call the API, so it cannot merge any other way. Give at most one of merge-token, app-id and ssh-key.
  update-behind:
    description: For fast-forward, rebase a pull request that is behind its base onto it and push the result to its branch (never a fork's), instead of leaving it. CI then runs on the new head and a later run merges it.
    default: "false"
  read-token:
    description: Token used to read pull requests, checks and review threads.
    default: ${{ github.token }}
  head-sha:
    description: Commit to act on. Defaults to the head of the workflow_run or pull_request_target event.
    default: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

runs:
  using: composite
  steps:
    - name: Check the conditions
      id: when
      uses: ExaDev/when-core@v1
      with:
        when: ${{ inputs.when }}
        conditions: |
          label:
          check:
          threads-resolved
          not-draft
          approvals:
          author:
          base:
        then: merge
        effects: merge
    - name: Mint a GitHub App installation token
      id: app
      if: inputs.app-id != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.read-token }}
        MERGE_TOKEN: ${{ inputs.merge-token || steps.app.outputs.token }}
        SSH_KEY: ${{ inputs.ssh-key }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ inputs.head-sha }}
        WHEN: ${{ steps.when.outputs.conditions }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        UPDATE_BEHIND: ${{ inputs.update-behind }}
      run: ${{ github.action_path }}/merge.sh
